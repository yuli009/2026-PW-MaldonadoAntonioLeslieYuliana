<!DOCTYPE html>
<html lang="es">
<head>| 
  <meta charset="UTF-8">
  <title>Registrar Asistencia - CECyT 9</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="detalle.html">Regresar al taller</a>

  </header>

  <main>
    <from class="formulario-registro" id=" form-registro" novalidate>
      <h1>Registrar Asistencia</h1>
      <label for="nombre">Nombre del alumno:</label>
      <input type="text" id="nombre" name="nombre" required>
      <span class="error" id="error-nombre"></span>

      <label for="boleta">Número de boleta:</label>
      <input type="text" id="boleta" name="boleta" required>
      <span class="error" id="error-boleta"></span>

      <label class="fecha">Fecha de registro(DD/MM/AAAA)</label>
      <input type="text" id="fecha" name="fecha"  placeholder="DD/MM/AAAA" required>
      <span class="error" id="error-fecha"></span>
      <button type="submit">Registrar</button>
      <p  class="mensaje-exito" id="mensaje-exito"></p>
    </from>

  </main>

  <script src="js/validacion.js"></script>
</body>
</html>
